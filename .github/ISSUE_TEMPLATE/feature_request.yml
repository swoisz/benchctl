name: Feature request
description: Something benchctl should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do on the bench, and where benchctl gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, option or profile key you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead.
